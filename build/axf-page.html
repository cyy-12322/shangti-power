
<html lang="cn">
<head>
    <meta charset="UTF-8">
    <meta name='viewport' content='width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=0'>
    <title>校园安心付</title>
    

<html>
<head>
    <link rel="stylesheet" href="/electric/lib/weui/weui.min.css">
    <link rel="stylesheet" href="/electric/css/font-awesome.min.css">
    <link rel="stylesheet" href="/electric/css/style.css">
    <script type="text/javascript" src="/electric/lib/jquery/jquery.js"></script>
    <script type="text/javascript" src="/electric/lib/jquery/plugs/jquery-form.js"></script>
    <script type="text/javascript" src="/electric/layer/layer.js"></script>
    <script type="text/javascript" src="/electric/js/md5.js"></script>
    <script type="text/javascript" src="/electric/lib/require/require.js"></script>
    <title></title>
</head>
<body>

</body>
</html>

    <script>
        var contextpath = "/electric";
        var SUCCESS = "00";
        var levels = [];
        var custNo = 'null';
        var custName = 'null';

        $(function () {
            if("" != custNo && undefined != custNo && 'null' != custNo ) {
                $("#custNo").val(custNo);
            }
            if("" != custName && undefined != custName && 'null' != custName) {
                $("#custName").val(custName);
            }
            //获取数据库 目录层级关系 初始化级联关系
            $.post(contextpath + "/level/getLevels", function (result) {
                if (result && SUCCESS == result.respCode) {
                    hideAll();
                    levels = result.data;
                    $.each(result.data, function (index, level) {
                        if (0 == level.rank) {
                            getData(level);
                        }
                        $("#" + level.type + "Div").show();
                        if (!level.end) {
                            $("#" + level.type).change(function () {
                                $("#loadingToast").css("display", "block");
                                if (undefined != $("#" + level.type).val() && "" != $("#" + level.type).val() && null != $("#" + level.type).val()) {
                                    getNextLevelData(result.data[index + 1], $("#" + level.type).val());
                                    hideOther(result.data[index + 1], result.data);
                                } else {
                                    hideOther(level, result.data);
                                }
                                $("#loadingToast").css("display", "none");
                            });
                        }
                    });
                }
            });

            //跳转到获取余额界面
            $("#toPay").click(function () {
                var data = $("#infoForm").serialize2Json();
                data['areaName'] = $("#area").find("option:selected").text();
                data['architectureName'] = $("#architecture").find("option:selected").text();
                data['floorName'] = $("#floor").find("option:selected").text();
                data['roomName'] = $("#room").find("option:selected").text();
                //去除XSS
                data['custNo'] = htmlEscape(data['custNo']);
                data['custName'] = htmlEscape(data['custName']);
                //判断数据 是否选全
                if ("" == data['custName'] || undefined == data['custName'] || 'null' == data['custName']) {
                    layer.msg('姓名必填,</br>请填写后再进行下一步', {
                        time: 3000, //3s后自动关闭
                    });
                    return;
                }
                if ("" == data['custNo'] || undefined == data['custNo'] || 'null' == data['custNo']) {
                    layer.msg('学号必填,</br>请填写后再进行下一步', {
                        time: 3000, //3s后自动关闭
                    });
                    return;
                }
	        if(data['custNo'].length < 8 || data['custNo'].length>10){
                    layer.msg('学号格式错误,</br>请填写正确后再进行下一步', {
                        time: 3000, //3s后自动关闭
                    });
                    return;
                }
                var flag = true;
                if (null != levels && undefined != levels && levels.length > 0) {
                    $.each(levels, function (index, dom) {
                        var paramName = $("#" + dom.type).attr("name");
                        if ("" == data[paramName] || undefined == data[paramName] || 'null' == data[paramName]) {
                            layer.msg(dom.remark + '未选择,</br>请选择后再进行下一步', {
                                time: 3000, //3s后自动关闭
                            });
                            flag = false;
                            return false;
                        }
                    });
                }
                if (flag) {
                    submitForm(contextpath + "/page/home", data);
                }
            });
        });

        //获取下一级目录的数据
        function getNextLevelData(nextLevel, parentId) {
            $.ajax({
                url: contextpath + "/getData" + nextLevel.url,
                type: "post",
                dataType: "json",
                async: false,
                data: {
                    areaId: $("#area").val(),
                    architectureId: $("#architecture").val(),
                    floorId: $("#floor").val(),
                    roomId: $("#room").val()
                },
                success: function (result) {
                    if (result) {
                        if (SUCCESS == result.respCode) {
                            if (result.data) {
                                var data = result.data;
                                initNextLevelData(data, nextLevel);
                            }
                        }
                    }
                }
            });
        }

        //初始化下一级目录的select
        function initNextLevelData(data, nextLevel) {
            $("#" + nextLevel.type).empty();
            $("#" + nextLevel.type).show();
            $("#" + nextLevel.type).attr("disabled", false);

            $("#" + nextLevel.type).append('<option value="">请选择</option>');
            $.each(data, function (index, dom) {
                var option = '<option value="' + dom.key + '">' + dom.value + '</option>';
                $("#" + nextLevel.type).append(option);
            });
        }

        //获取当前 目录下的数据
        function getData(level) {
            $.ajax({
                url: contextpath + "/getData" + level.url,
                type: "post",
                dataType: "json",
                async: false,
                success: function (result) {
                    if (result) {
                        if (SUCCESS == result.respCode) {
                            if (result.data) {
                                var data = result.data;
                                initData(data, level);
                            }
                        }
                    }
                }
            });
        }
        //初始化当前目录的select
        function initData(data, level) {
            $('select').empty();
            $("#" + level.type).show();
            $("#" + level.type).attr("disabled", false);
            $("#" + level.type).append('<option value="">请选择</option>');
            $.each(data, function (index, dom) {
                var option = '<option value="' + dom.key + '">' + dom.value + '</option>';
                $("#" + level.type).append(option);
            });
        }

        //隐藏层级比自己低的其他目录数据
        function hideOther(level, levels) {
            $.each(levels, function (index, dom) {
                if (level.rank < dom.rank) {
                    $("#" + dom.type).empty();
                    $("#" + dom.type).hide();
                    $("#" + dom.type).attr("disabled", true);
                }
            });
        }

        function hideAll() {
            $("#area").hide();
            $("#area").attr("disabled", true);
            $("#architecture").hide();
            $("#architecture").attr("disabled", true);
            $("#floor").hide();
            $("#floor").attr("disabled", true);
            $("#room").hide();
            $("#room").attr("disabled", true);
        }

        function submitForm(url, data) {
            $("#loadingToast").css("display", "block");
            var formId = '_submitForm_';
            if ($("#" + formId)) {
                $("#" + formId).remove();
            }
            var formData = data;
            var formBody = '';
            for (var key in formData) {
                if (formData[key] || formData[key] == '0') {
                    var input = '<input type="text" name="' + key + '" value="' + formData[key] + '" />';
                    formBody += input;
                }
            }
            formBody += '<input type="submit" />';
            var hiddenForm = '<form id="' + formId + '" target="_self" method="post" action="' + url + '" style="display: none;">' + formBody + '</form>';
            $(hiddenForm).appendTo($("body"));
            $("#" + formId).submit();
            $("#loadingToast").css("display", "none");
        }

        function htmlEscape(text){
            return text.replace(/[<>"&]/g, function(match, pos, originalText){
                switch(match){
                    case "<": return "&lt;";
                    case ">":return "&gt;";
                    case "&":return "&amp;";
                    case "\"":return "&quot;";
                }
            });
        }

    </script>
</head>
<body>
<div class="screen-wrapper">
    <div class="screen-main">
        <div class="weui-panel weui-panel_access">
            <div class="weui-panel__bd">
                <div class="weui-media-box">
                    <form id="infoForm" action="javascript:void(0)" method="post">
                        <div class="weui-cells">
                            <div class="weui-cell">
                                <div class="weui-cell__hd">
                                    姓&emsp;名<font color="red">*</font>
                                </div>
                                <div class="weui-cell__bd">
                                    <input class="weui-input" name="custName" id="custName" maxlength="15">
                                </div>
                            </div>
                            <div class="weui-cell">
                                <div class="weui-cell__hd">
                                    学&emsp;号<font color="red">*</font>
                                </div>
                                <div class="weui-cell__bd">
                                    <input class="weui-input" name="custNo" id="custNo" maxlength="20">
                                </div>
                            </div>
                            <div class="weui-cell" id="areaDiv" style="display: none;">
                                <div class="weui-cell__hd">
                                    区&emsp;域
                                </div>
                                <div class="weui-cell__bd">
                                    <select class="weui-select" name="areaId" id="area">
                                    </select>
                                </div>
                            </div>
                            <div class="weui-cell" id="architectureDiv" style="display: none;">
                                <div class="weui-cell__hd">
                                    楼栋名
                                </div>
                                <div class="weui-cell__bd" style="height: 45px;">
                                    <select class="weui-select" name="architectureId" id="architecture">
                                    </select>
                                </div>
                            </div>
                            <div class="weui-cell" id="floorDiv" style="display: none;">
                                <div class="weui-cell__hd">
                                    楼&emsp;层
                                </div>
                                <div class="weui-cell__bd" style="height: 45px;">
                                    <select class="weui-select" name="floor" id="floor">
                                    </select>
                                </div>
                            </div>
                            <div class="weui-cell" id="roomDiv" style="display: none;">
                                <div class="weui-cell__hd">
                                    房间名
                                </div>
                                <div class="weui-cell__bd" style="height: 45px;">
                                    <select class="weui-select" name="roomId" id="room">
                                    </select>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="weui-btn-area">
            <button class="weui-btn weui-btn_primary" type="button" id="toPay">下一步</button>
        </div>
    </div>
    <div id="loadingToast" style="display:none;">
        <div class="weui-mask_transparent"></div>
        <div class="weui-toast">
            <i class="weui-loading weui-icon_toast"></i>
            <p class="weui-toast__content">数据加载中</p>
        </div>
    </div>
</div>
<div class="footer">
    <img src="/electric/assets/footer1.png">
</div>
</body>
</html>
