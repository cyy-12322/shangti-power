name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnostics
        shell: pwsh
        run: |
          "PowerShell: $($PSVersionTable.PSVersion)"
          "OS: $([Environment]::OSVersion.VersionString)"
          $csc64 = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          "csc64 exists: $(Test-Path $csc64)"
          "asset ico: $((Get-Item .\assets\query.ico).Length) bytes"

      - name: Build app + installer (csc, .NET Framework)
        shell: pwsh
        run: ./build/build.ps1

      - name: Show outputs
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object {
            $s = Get-AuthenticodeSignature $_.FullName
            "{0}: {1}" -f $_.Name, $s.Status
          }

      - name: Package zip (installer + readme)
        shell: pwsh
        run: |
          $v = (Get-Content .release-version -Raw).Trim()
          $stage = "dist/pkg"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "dist/宿电监测安装包.exe" $stage -Force
          Copy-Item "dist/安装说明.txt" $stage -Force
          Copy-Item "dist/Install-Unblocked.cmd" $stage -Force
          Copy-Item "README.md" $stage -Force
          $zip = "dist/SudianMonitor-$v.zip"
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -CompressionLevel Optimal
          Copy-Item "dist/宿电监测安装包.exe" "dist/SudianMonitor-Setup.exe" -Force
          Copy-Item "dist/安装说明.txt" "dist/INSTALL.txt" -Force
          Get-ChildItem dist/SudianMonitor-* | Select-Object Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SudianMonitor
          path: |
            dist/SudianMonitor-Setup.exe
            dist/SudianMonitor-*.zip
            dist/INSTALL.txt
            dist/Install-Unblocked.cmd
          if-no-files-found: error

      - name: Publish GitHub Release (when .release-version is bumped)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not (Test-Path .release-version)) { "no .release-version, skip"; exit 0 }
          $v = (Get-Content .release-version -Raw).Trim()
          if ([string]::IsNullOrEmpty($v)) { "empty version, skip"; exit 0 }
          $tag = "v$v"
          $zip = "dist/SudianMonitor-$v.zip"

          Get-FileHash "dist/SudianMonitor-Setup.exe", $zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Path dist/SHA256SUMS.txt -Encoding utf8

          $notes = @"
## 宿电监测 ${tag}

- 绿色单文件安装包，双击即可安装
- 首次启动选择校区 / 楼栋 / 楼层 / 房间，之后自动记住
- 支持开机自启、低电量提醒、手动刷新

### 安装包说明

- `SudianMonitor-Setup.exe`：安装程序
- `SudianMonitor-$v.zip`：安装包 + 安装说明 + 解封脚本（推荐下载这个）
- `INSTALL.txt`：遇到 SmartScreen 拦截时的处理办法

> 本版本未做商业代码签名，首次运行可能出现 SmartScreen 提示，
> 点「更多信息 → 仍要运行」即可；详见 INSTALL.txt。
"@

          $assets = @(
            "dist/SudianMonitor-Setup.exe",
            $zip,
            "dist/INSTALL.txt",
            "dist/Install-Unblocked.cmd",
            "dist/SHA256SUMS.txt"
          )

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            "Release $tag exists, updating assets"
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --target $env:GITHUB_SHA --title "宿电监测 $tag" --notes $notes
          }

          # 清理历史遗留的错误附件名（不要影响退出码）
          $ErrorActionPreference = 'Continue'
          foreach ($legacy in @('default.txt', 'ShangtiPower.exe', 'ShangtiPowerSetup.exe')) {
            gh release delete-asset $tag $legacy --yes 2>$null | Out-Null
          }
          "done"
          exit 0
