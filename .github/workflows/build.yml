name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnostics
        shell: pwsh
        run: |
          "PowerShell: $($PSVersionTable.PSVersion)"
          "OS: $([Environment]::OSVersion.VersionString)"
          $csc64 = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          "csc64 exists: $(Test-Path $csc64)"
          "asset ico: $((Get-Item .\assets\query.ico).Length) bytes"

      - name: Build app + installer (csc, .NET Framework)
        shell: pwsh
        run: ./build/build.ps1

      - name: Show signatures
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object {
            $s = Get-AuthenticodeSignature $_.FullName
            "{0}: {1}" -f $_.Name, $s.Status
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShangtiPower
          path: |
            dist/ShangtiPower.exe
            dist/ShangtiPowerSetup.exe
            dist/安装说明.txt
            dist/Install-Unblocked.cmd
          if-no-files-found: error

      - name: Publish GitHub Release (when .release-version is bumped)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not (Test-Path .release-version)) { "no .release-version, skip"; exit 0 }
          $v = (Get-Content .release-version -Raw).Trim()
          if ([string]::IsNullOrEmpty($v)) { "empty version, skip"; exit 0 }
          $tag = "v$v"

          Get-FileHash dist/ShangtiPower.exe, dist/ShangtiPowerSetup.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Path dist/SHA256SUMS.txt -Encoding utf8

          # GitHub 附件名只支持 ASCII，所以上传一份改名的说明文件
          Copy-Item "dist/安装说明.txt" "dist/INSTALL.txt" -Force

          $notes = "首个开源版本。详见 CHANGELOG.md。`n`n> 未签名版本首次运行会触发 Windows SmartScreen；点「更多信息 → 仍要运行」即可，详见 INSTALL.txt。"

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            "Release $tag 已存在，更新附件"
            gh release upload $tag "dist/ShangtiPower.exe" "dist/ShangtiPowerSetup.exe" "dist/INSTALL.txt" "dist/Install-Unblocked.cmd" "dist/SHA256SUMS.txt" --clobber
          } else {
            gh release create $tag `
              "dist/ShangtiPower.exe" `
              "dist/ShangtiPowerSetup.exe" `
              "dist/INSTALL.txt" `
              "dist/Install-Unblocked.cmd" `
              "dist/SHA256SUMS.txt" `
              --target $env:GITHUB_SHA `
              --title "ShangtiPower $tag" `
              --notes $notes
          }

          # 清理历史遗留的错误附件名（中文文件名曾被 GitHub 改成 default.txt）。
          # 注意：附件不存在时 gh 返回非 0，不能让它污染本步骤的退出码。
          $ErrorActionPreference = 'Continue'
          gh release delete-asset $tag default.txt --yes 2>$null | Out-Null
          "清理完成（附件不存在属正常）"

          exit 0

