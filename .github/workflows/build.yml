name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnostics
        shell: pwsh
        run: |
          "PowerShell: $($PSVersionTable.PSVersion)"
          "OS: $([Environment]::OSVersion.VersionString)"
          "ExecutionPolicy: $(Get-ExecutionPolicy)"
          $csc64 = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          "WINDIR: $env:WINDIR"
          "csc64: $csc64 exists=$(Test-Path $csc64)"
          "asset ico: $((Get-Item .\assets\query.ico).Length) bytes"
          "installer files: $((Get-ChildItem .\installer | Measure-Object).Count)"
          "build.ps1 exists: $(Test-Path .\build\build.ps1)"

      - name: Build app + installer (csc, .NET Framework)
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          ./build/build.ps1 *>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          "build.ps1 exit code: $code"
          "setup exists: $(Test-Path .\dist\ShangtiPowerSetup.exe)"
          if ($code -ne 0 -or -not (Test-Path .\dist\ShangtiPowerSetup.exe)) { exit 1 }

      - name: Publish build log when it fails
        if: steps.build.outcome != 'success'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Copy-Item build.log ci-build.log -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path ci-build.log)) { "no build.log produced" | Set-Content ci-build.log -Encoding utf8 }
          git add -f ci-build.log
          git commit -m "ci: build log [skip ci]"
          git push --force origin HEAD:refs/heads/ci-logs
          if ($LASTEXITCODE -ne 0) {
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            Copy-Item build.log ci-build.log -Force -ErrorAction SilentlyContinue
            if (-not (Test-Path ci-build.log)) { "no build.log produced" | Set-Content ci-build.log -Encoding utf8 }
            git add -f ci-build.log
            git commit -m "ci: build log [skip ci]"
            git push origin main
          }

      - name: Show signatures (unsigned unless signed in CI)
        if: steps.build.outcome == 'success'
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object {
            $s = Get-AuthenticodeSignature $_.FullName
            "{0}: {1}" -f $_.Name, $s.Status
          }

      - name: Upload artifacts
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ShangtiPower
          path: |
            dist/ShangtiPower.exe
            dist/ShangtiPowerSetup.exe
            dist/安装说明.txt

      - name: Publish GitHub Release (on tag)
        if: steps.build.outcome == 'success' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Get-FileHash dist/ShangtiPower.exe, dist/ShangtiPowerSetup.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Path dist/SHA256SUMS.txt -Encoding utf8
          gh release create "$env:GITHUB_REF_NAME" `
            "dist/ShangtiPower.exe" `
            "dist/ShangtiPowerSetup.exe" `
            "dist/安装说明.txt" `
            "dist/SHA256SUMS.txt" `
            --title "$env:GITHUB_REF_NAME" `
            --notes "详见 CHANGELOG.md。下载后如遇 SmartScreen 提示，请查看安装说明.txt。"
